<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Economie HV">
<meta name="theme-color" content="#f08a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Economie havo/vwo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23f08a09'/><path d='M28 28 L50 74 L72 28' fill='none' stroke='white' stroke-width='12' stroke-linejoin='round' stroke-linecap='round'/></svg>">
<style>
/* ===== Vellesan College huisstijl: oranje #F08A09, antraciet #171C24, Raleway =====
   Layout geïnspireerd op moderne nieuws-, shop- en sportdashboards: witte topnavigatie,
   grote fotokoppen met donkere overlay, fotokaarten en een dashboard in kolommen. */
:root{--bg:#f4f4f2;--kaart:#ffffff;--ink:#171c24;--zacht:#626873;--lijn:#e5e3df;--acc:#f08a09;--knop:#e47f00;--donker:#171c24;--goed:#1f9e6e;--fout:#d6453d;--goud:#d9a521;--r:10px;
  --schaduw:0 1px 2px rgba(23,28,36,.05),0 1px 0 rgba(23,28,36,.03);--kop:"Raleway","Helvetica Neue",Helvetica,Arial,sans-serif;--tekst:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body.th-nacht{--bg:#12161d;--kaart:#1d232c;--ink:#eef0f4;--zacht:#a7afbf;--lijn:#2f3744;--donker:#0b0e13}
body.th-zee{--acc:#1b8fb0;--knop:#167b98}
body.th-bos{--acc:#3f8f3a;--knop:#367c32}
body.th-snoep{--acc:#d64f8f;--knop:#c2407e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--tekst);-webkit-text-size-adjust:100%;font-variant-numeric:lining-nums}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.sectie,.knop,.chip,.getal,.eyebrow{font-family:var(--kop);font-variant-numeric:lining-nums}
h1,h2,h3{letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--knop)}

/* ---------- topnavigatie ---------- */
.topnav{background:var(--kaart);border-bottom:1px solid var(--lijn);position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topnav .rij1{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;min-height:66px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.logo svg{width:40px;height:40px;flex:none}
.logo .lw{display:flex;flex-direction:column;line-height:1}
.logo .lw b{font:800 23px/1 var(--kop);color:#4a4d52;letter-spacing:-.02em}
body.th-nacht .logo .lw b{color:#e8eaee}
.logo .lw small{font:700 11px/1.2 var(--kop);color:var(--acc);letter-spacing:.18em;margin-top:3px}
.logo .vak{font:700 14px/1.2 var(--kop);color:var(--zacht);border-left:1px solid var(--lijn);padding-left:12px;margin-left:4px}
.topnav .rechts{margin-left:auto;display:flex;align-items:center;gap:10px}
.profiel{display:flex;align-items:center;gap:10px;border:2px solid var(--acc);border-radius:8px;background:none;padding:5px 12px 5px 5px;color:var(--knop);font:700 15px var(--kop);max-width:240px}
.profiel span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 14px var(--kop);flex:none}
.ikoonknop{border:0;background:var(--acc);color:#fff;border-radius:8px;height:44px;padding:0 16px;font:800 14px var(--kop);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.topnav .rij2{border-top:1px solid var(--lijn)}
.menu{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{border:0;background:none;border-radius:999px;padding:9px 18px;font:600 16px var(--tekst);color:var(--ink);white-space:nowrap}
.menu button:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.menu button.aan{background:var(--donker);color:#fff}
body.th-nacht .menu button.aan{background:var(--acc)}
body[data-scherm=quiz] .rij2,body[data-scherm=welkom] .rij2,body[data-scherm=quiz] .rechts,body[data-scherm=welkom] .rechts{display:none}
body[data-scherm=quiz] .topnav{position:static}

/* ---------- algemene layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 60px}
.wrap.smal{max-width:820px}
.sectie{display:flex;align-items:baseline;gap:12px;margin:36px 0 16px;font-size:24px;font-weight:800;color:var(--ink)}
.sectie .meer{margin-left:auto;font:600 15px var(--tekst);color:var(--zacht);border:0;background:none;padding:0}
.sectie:first-child{margin-top:0}
.kaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:22px;box-shadow:var(--schaduw)}
.kaart h3{font-size:20px;font-weight:800}
.zacht{color:var(--zacht)}
.mid{text-align:center}
.groot{font-size:56px;text-align:center;margin:6px 0}
.eyebrow{display:inline-block;font:800 13px/1 var(--kop);letter-spacing:.12em;text-transform:uppercase}

/* ---------- foto-koppen ---------- */
.foto{position:relative;background:#2b313b center/cover no-repeat;color:#fff;overflow:hidden}
.foto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,18,24,.82) 0%,rgba(15,18,24,.55) 45%,rgba(15,18,24,.15) 100%);pointer-events:none}
.foto>*{position:relative;z-index:1}
.held{min-height:440px;display:flex;align-items:center}
.held .in{max-width:1240px;width:100%;margin:0 auto;padding:56px 24px;display:flex;gap:40px;align-items:center}
.held h1{font:800 54px/1.05 var(--kop);text-transform:uppercase;margin:12px 0 16px;max-width:760px;letter-spacing:-.01em}
.held p{font-size:19px;max-width:600px;margin:0 0 26px;opacity:.95}
.held .eyebrow{color:var(--acc)}
.usp{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-wrap:wrap;gap:8px 26px;font-weight:600;font-size:16px}
.usp li::before{content:"✓";color:var(--acc);font-weight:900;margin-right:8px}
.paneel{flex:none;width:300px;background:rgba(40,44,52,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r);overflow:hidden;align-self:stretch;max-height:340px}
.paneel h4{margin:0;padding:16px 20px;background:rgba(255,255,255,.12);font:800 15px var(--kop);text-transform:uppercase;letter-spacing:.06em}
.paneel button{display:flex;gap:10px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:11px 20px;font-size:16px;opacity:.92}
.paneel button:hover{background:rgba(255,255,255,.08)}
.paneel button span:first-child{width:22px;text-align:center}
.paginakop{border-radius:var(--r);min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 26px;margin-bottom:26px}
.paginakop::after{background:linear-gradient(0deg,rgba(15,18,24,.85) 0%,rgba(15,18,24,.35) 70%,rgba(15,18,24,.2) 100%)}
.paginakop h1{font:800 36px/1.1 var(--kop);margin:4px 0 0}
.paginakop .bovenin{position:absolute;top:16px;left:22px;right:22px;display:flex;gap:8px;align-items:center}
.paginakop .bovenin .chip:first-of-type{margin-left:auto}
.terug{border:0;background:none;color:var(--knop);font:700 16px var(--kop);padding:6px 4px 6px 0}
.foto .terug{color:#fff;background:rgba(0,0,0,.3);border-radius:999px;padding:7px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--kaart);border:1px solid var(--lijn);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px}
.foto .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* oude kop (fallback) */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:800 26px/1.2 var(--kop);margin:0;flex:1;min-width:200px}

/* ---------- knoppen ---------- */
.knop{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:13px 24px;font-weight:800;background:var(--knop);color:#fff;font-size:16px;letter-spacing:.03em;min-height:50px;transition:filter .1s,transform .05s}
.knop:hover{filter:brightness(1.06)}
.knop:active{transform:translateY(1px)}
.knop.groot{font-size:18px;padding:16px 32px;text-transform:uppercase;letter-spacing:.05em}
.knop.zacht{background:var(--kaart);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn))}
.knop.rand{background:transparent;color:var(--knop);border:2px solid var(--knop)}
.knop.vol{width:100%}
.knop:disabled{opacity:.45}
.knop.klein{min-height:40px;padding:8px 14px;font-size:14px}

/* ---------- dashboard (startpagina) ---------- */
.dash{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:28px;align-items:start}
.dash>aside{display:flex;flex-direction:column;gap:22px}
.profielkaart{padding:0;overflow:hidden;text-align:center}
.profielkaart .bg{height:70px;background:linear-gradient(120deg,var(--knop),var(--acc))}
.profielkaart .avatar{width:84px;height:84px;font-size:32px;border-radius:14px;margin:-42px auto 10px;border:4px solid var(--kaart);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.profielkaart h2{margin:0;font-size:24px;font-weight:800}
.profielkaart .klas{color:var(--zacht);font-size:15px;margin:2px 0 14px}
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--lijn);border-bottom:1px solid var(--lijn)}
.cijfers div{padding:14px 6px}
.cijfers div+div{border-left:1px solid var(--lijn)}
.cijfers small{display:block;color:var(--zacht);font-size:13px}
.getal{font:700 28px/1.15 var(--tekst);letter-spacing:-.01em}
.profielkaart .blok{text-align:left;padding:16px 20px;border-bottom:1px solid var(--lijn)}
.profielkaart .blok:last-child{border-bottom:0}
.profielkaart .blok>small{display:block;color:var(--zacht);font-size:14px;margin-bottom:8px}
.streak{display:flex;align-items:flex-end;gap:6px}
.streak .vlam{text-align:center;color:var(--acc);font:800 12px/1.1 var(--kop);min-width:38px}
.streak .vlam b{display:block;font-size:24px}
.dagen{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;flex:1;text-align:center;font-size:12px;color:var(--zacht)}
.dagen i{display:grid;place-items:center;width:26px;height:26px;margin:4px auto 0;border-radius:50%;border:1px solid var(--lijn);font-style:normal;font-size:12px;color:var(--ink)}
.dagen i.ja{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:800}
.dagen i.nu{border:2px solid var(--ink)}
.linkrij{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:16px 20px;color:var(--knop);font-weight:700;font-size:16px}
.mijlpaal b{font-family:var(--kop);font-size:18px}

.uitgelicht{border-radius:var(--r);min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px;cursor:pointer;border:0;width:100%;text-align:left}
.uitgelicht::after{background:linear-gradient(0deg,rgba(15,18,24,.9) 0%,rgba(15,18,24,.45) 55%,rgba(15,18,24,.05) 100%)}
.uitgelicht .eyebrow{color:var(--acc)}
.uitgelicht h2{font:800 34px/1.12 var(--kop);margin:8px 0 6px}
.uitgelicht p{margin:0 0 18px;opacity:.92;font-size:17px}
.uitgelicht .knop{align-self:flex-start;text-transform:uppercase}

.fotogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.fotokaart{border-radius:var(--r);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border:0;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}
.fotokaart::after{background:linear-gradient(0deg,rgba(15,18,24,.92) 0%,rgba(15,18,24,.5) 50%,rgba(15,18,24,.08) 100%)}
.fotokaart:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(23,28,36,.18)}
.fotokaart:active{transform:scale(.985)}
.fotokaart .nr{position:absolute;top:14px;left:14px;background:var(--k,var(--acc));color:#fff;font:800 12px/1 var(--kop);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:5px}
.fotokaart .status{position:absolute;top:12px;right:12px;font-size:22px}
.fotokaart h3{font:800 20px/1.2 var(--kop);margin:0 0 4px}
.fotokaart p{margin:0 0 10px;font-size:14px;opacity:.88}
.fotokaart .balk{background:rgba(255,255,255,.25)}
.fotokaart .balk>i{background:var(--acc)}
.fotokaart.dicht{filter:grayscale(1);opacity:.6}

.zijkop{font:800 22px var(--kop);margin:0 0 14px}
.uitdaging{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--lijn)}
.uitdaging:last-of-type{border-bottom:0}
.uitdaging .thumb{width:62px;height:62px;border-radius:8px;flex:none;background:#2b313b center/cover;display:grid;place-items:center;font-size:26px;color:#fff;position:relative;overflow:hidden}
.uitdaging .thumb::after{content:"";position:absolute;inset:0;background:rgba(15,18,24,.25)}
.uitdaging .thumb span{position:relative;z-index:1}
.uitdaging b{display:block;font:700 17px/1.25 var(--kop)}
.uitdaging small{color:var(--zacht);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badges span{aspect-ratio:1;display:grid;place-items:center;font-size:28px;border-radius:10px;background:color-mix(in srgb,var(--acc) 12%,var(--kaart));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--lijn))}
.badges span.nee{filter:grayscale(1);opacity:.35;background:var(--bg);border-color:var(--lijn)}

/* ---------- hoofdstukpagina ---------- */
.statstrook{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);margin:-46px auto 0;position:relative;z-index:2;box-shadow:0 8px 24px rgba(23,28,36,.08)}
.statstrook div{padding:18px 22px}
.statstrook div+div{border-left:1px solid var(--lijn)}
.statstrook small{display:block;color:var(--zacht);font-size:14px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.levelkaart{background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:20px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--schaduw);border-top:4px solid var(--k,var(--acc));min-height:170px}
.levelkaart:hover{box-shadow:0 10px 24px rgba(23,28,36,.10)}
.levelkaart .boven{display:flex;justify-content:space-between;align-items:center;font:800 12px var(--kop);letter-spacing:.08em;text-transform:uppercase;color:var(--zacht)}
.levelkaart .boven span:last-child{font-size:26px;letter-spacing:0}
.levelkaart h3{margin:2px 0 0;font-size:19px;font-weight:800}
.levelkaart p{margin:0;color:var(--zacht);font-size:15px}
.levelkaart .onder{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:10px;font-weight:700;color:var(--knop);font-size:15px}
.levelkaart.dicht{opacity:.55}
.toetsblok{display:flex;gap:22px;align-items:center;background:var(--donker);color:#fff;border-radius:var(--r);padding:26px;margin-top:18px}
.toetsblok .ic{font-size:46px}
.toetsblok h3{margin:0;font:800 22px var(--kop)}
.toetsblok p{margin:4px 0 0;color:#c9ced6}

/* ---------- lijsten en tegels (overige pagina's) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tegel{position:relative;background:var(--kaart);border:1px solid var(--lijn);border-radius:var(--r);padding:18px;text-align:left;box-shadow:var(--schaduw);min-height:130px;display:flex;flex-direction:column;gap:6px}
.tegel .ic{font-size:28px}
.tegel h3{margin:4px 0 0;font-size:18px;font-weight:800}
.tegel p{margin:0;color:var(--zacht);font-size:14px}
.balk{height:8px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:99px;overflow:hidden}
.balk>i{display:block;height:100%;background:var(--k,var(--acc));border-radius:99px}
.rij{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--lijn)}
.rij:last-child{border-bottom:0}
.lv{width:100%;border:0;background:none;text-align:left;display:flex;align-items:center;gap:14px;padding:14px 8px;border-bottom:1px solid var(--lijn)}
.lv:hover{background:color-mix(in srgb,var(--acc) 5%,var(--kaart))}
.lv:last-child{border-bottom:0}
.lv .med{font-size:28px;width:40px;text-align:center}
.lv b{display:block;font-family:var(--kop);font-weight:700}
.lv small{color:var(--zacht)}
.domein{display:grid;grid-template-columns:34px 1fr 52px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--lijn)}
.domein:last-child{border-bottom:0}
.pct{font-weight:800;text-align:right;font-family:var(--kop)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.bk{border-radius:var(--r);padding:14px;min-height:110px;background:var(--kaart);border:1px solid var(--lijn);border-top:3px solid var(--acc);font-size:13px;box-shadow:var(--schaduw)}
.bk b{display:block;font:800 15px/1.3 var(--kop);margin-bottom:4px}
.bk.nee{background:repeating-linear-gradient(45deg,var(--lijn),var(--lijn) 6px,transparent 6px,transparent 12px);color:transparent;border-top-color:var(--lijn);box-shadow:none}
.bk.nee b{color:var(--zacht)}
.welkom-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}

/* ---------- oefenen ---------- */
.vraag{white-space:pre-line;font:700 22px/1.4 var(--kop);margin:6px 0 22px}
.opties{display:grid;gap:10px}
.optie{border:2px solid var(--lijn);background:var(--kaart);border-radius:8px;padding:14px 16px;text-align:left;font-size:17px;display:flex;gap:14px;align-items:center;min-height:58px;transition:border-color .1s,background .1s}
.optie:hover{border-color:color-mix(in srgb,var(--acc) 55%,var(--lijn))}
.optie .l{font:800 15px/1 var(--kop);color:var(--ink);min-width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--bg);flex:none}
.optie.kies{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--kaart))}
.optie.kies .l{background:var(--knop);color:#fff}
.opties .optie.goed{border-color:var(--goed);background:color-mix(in srgb,var(--goed) 10%,var(--kaart))}
.optie.goed .l{background:var(--goed);color:#fff}
.opties .optie.fout{border-color:var(--fout);background:color-mix(in srgb,var(--fout) 9%,var(--kaart))}
.optie.fout .l{background:var(--fout);color:#fff}
#qz{max-width:820px}
#qz>.kaart{padding:30px;border-top:4px solid var(--k,var(--acc))}
#qz .top{padding-bottom:14px;border-bottom:1px solid var(--lijn)}
#qz .top h1{font-size:20px}
.koppel{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;align-items:center}
select,input[type=text],input[type=number],input[type=password]{font:inherit;width:100%;padding:13px 14px;border:1px solid color-mix(in srgb,var(--ink) 22%,var(--lijn));border-radius:6px;background:var(--kaart);color:var(--ink);min-height:50px}
select:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select.goed,input.goed{border-color:var(--goed);border-width:2px} select.fout,input.fout{border-color:var(--fout);border-width:2px}
.reken{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:700}
.reken input{font-size:22px;max-width:240px}
.fb{margin-top:18px;padding:14px 18px;border-radius:8px;font-size:16px}
.fb.goed{background:color-mix(in srgb,var(--goed) 10%,var(--kaart));border-left:5px solid var(--goed)}
.fb.fout{background:color-mix(in srgb,var(--fout) 8%,var(--kaart));border-left:5px solid var(--fout)}
.voet{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
.voortgang{display:flex;gap:5px;margin:16px 0}
.voortgang i{flex:1;height:6px;border-radius:9px;background:var(--lijn)}
.voortgang i.g{background:var(--goed)} .voortgang i.f{background:var(--fout)} .voortgang i.nu{background:var(--acc)}
.label{display:block;font-weight:700;margin:14px 0 6px}
.code{font:700 24px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--knop)}

/* ---------- tabellen, meldingen ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--lijn);text-align:left;vertical-align:top}
th{font:800 12px var(--kop);text-transform:uppercase;letter-spacing:.05em;color:var(--zacht);background:var(--bg)}
.tabelwrap{overflow-x:auto}
.melding{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--donker);color:#fff;padding:12px 18px;border-radius:8px;z-index:30;font-weight:600;max-width:92vw;border-left:5px solid var(--acc);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sync{font-size:13px}
.sync.ok{color:var(--goed)} .sync.fout{color:var(--fout)}

/* ---------- voettekst ---------- */
.voettekst{background:var(--donker);color:#aab1bc;font-size:14px}
.voettekst .in{max-width:1240px;margin:0 auto;padding:26px 24px calc(26px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center}
.voettekst b{color:#fff;font-family:var(--kop)}
.voettekst .o{color:var(--acc)}

/* ---------- iPad en kleiner ---------- */
@media (max-width:1180px){.dash{grid-template-columns:280px minmax(0,1fr)}.dash>aside.rechts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:900px){.paneel{display:none}.held h1{font-size:42px}.held{min-height:380px}}
@media (max-width:820px){.dash{grid-template-columns:1fr}.dash>aside.links{display:grid;grid-template-columns:1fr}.dash>aside.rechts{grid-template-columns:1fr}.logo .vak{display:none}.profiel span:last-child{display:none}.profiel{padding:5px}.uitgelicht{min-height:300px}.uitgelicht h2{font-size:28px}}
@media (max-width:560px){.wrap{padding:20px 16px 40px}.topnav .rij1,.menu{padding-left:16px;padding-right:16px}.held .in{padding:40px 16px}.held h1{font-size:32px}.koppel{grid-template-columns:1fr}.vraag{font-size:19px}.ikoonknop .t{display:none}.paginakop h1{font-size:28px}.statstrook div+div{border-left:0;border-top:1px solid var(--lijn)}#qz>.kaart{padding:20px}.logo .lw b{font-size:20px}}
@media print{.topnav,.terug,.voet,.voettekst{display:none}}

// Alles wat alleen kan groeien (tijd, aantallen, medailles) wordt bij samenvoegen met max/union gecombineerd,
// zodat een oud apparaat nooit nieuwe voortgang kan overschrijven.
function nieuweStaat(){
  return {v:1, id:'', code:'', naam:'', klas:'', upd:0, aangemaakt:Date.now(),
    xp:0, mVerd:0, mUit:0, tijd:0, dag:{}, week:{},

}
let S = null;

const UNION = new Set(['kaarten','badges','gekocht']);
function merge(a,b){
  // b is de nieuwste (hoogste upd) bij gelijke velden die niet kunnen groeien
  if(a===undefined||a===null) return b; if(b===undefined||b===null) return a;
  if(typeof a==='number'&&typeof b==='number') return Math.max(a,b);
  if(Array.isArray(a)&&Array.isArray(b)) return b;
  if(typeof a==='object'&&typeof b==='object'){
    const o={}; for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
      if(UNION.has(k)&&Array.isArray(a[k])&&Array.isArray(b[k])) o[k]=[...new Set([...a[k],...b[k]])];
      else if(k==='et') o[k]=mergeEt(a[k],b[k]);
      else o[k]=merge(a[k],b[k]);
    } return o;
  }
  return b;
}
function mergeEt(a,b){ // per eindterm een lijstje recente resultaten; neem de langste/nieuwste
  a=a||{}; b=b||{}; const o={};
  for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k]||{n:0,r:[]},y=b[k]||{n:0,r:[]};o[k]=(y.n>=x.n)?y:x}
  return o;
}
function mergeStaat(oud,nieuw){ // oud en nieuw in willekeurige volgorde
  const [x,y] = (oud.upd||0)<=(nieuw.upd||0)?[oud,nieuw]:[nieuw,oud];
  const m = merge(x,y); m.upd=Math.max(x.upd||0,y.upd||0); return m;
}

async function api(actie, data){
  const r = await fetch(DATA_ENDPOINT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({actie},data))});
  const j = await r.json(); if(!j.ok) throw new Error(j.fout||'Serverfout'); return j;
}
function planSync(ms=4000){ if(!serverModus()||!S||!S.id) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms) }
async function sync(){
  if(!serverModus()||!S||!S.id||bezig) return; bezig=true;
  try{
    const j = await api('sync',{id:S.id, code:S.code, staat:S});
    const terug = j.staat; S = mergeStaat(S, terug); S.id=terug.id||S.id; S.code=S.code||terug.code;
    try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){}
    vuil=false; syncStatus='ok'; syncTijd=Date.now();
  }catch(e){ syncStatus='fout'; syncFout=e.message; planSync(60000) }
  bezig=false; toonSyncStatus && toonSyncStatus();
}

  reeleRente(){ const n=pick([2,3,4,4.5,5,6]), i=pick([1,1.5,2,2.5,3,4,7]); const a=r1(n-i); return {t:'reken', e:'E.rente', q:`De nominale rente is ${nl1(n)}% en de inflatie is ${nl1(i)}%. Hoe hoog is de reële rente bij benadering? (negatief kan)`, a, eh:'%', u:`Reële rente ≈ nominale rente − inflatie = ${nl1(n)} − ${nl1(i)} = ${nl1(a)}%.`} },
  // --- G Risico en informatie ---
  verwachteSchade(){ const N=pick([50,100,200,250,500]), S0=pick([1000,2000,5000,10000,25000]); const a=r2(S0/N); return {t:'reken', e:'G.risico', q:`De kans dat je fiets in een jaar gestolen wordt is 1 op ${N}. Een nieuwe fiets kost ${eur(S0)}. Hoe groot is de verwachte schade per jaar?`, a, eh:'€', u:`Verwachte schade = kans × schade = 1/${N} × ${gt(S0)} = ${eur(a)}. Dit is de 'zuivere' premie, zonder kosten en winst van de verzekeraar.`} },
  // --- H Welvaart en groei ---
  reeleGroei(){ const n=pick([3,4,5,6,7,8]), p=pick([1,2,3,4,5]); const a=r1(((1+n/100)/(1+p/100)-1)*100); return {t:'reken', e:'H.groei', q:`Het nominale bbp groeit met ${n}% en het prijspeil stijgt met ${p}%. Bereken de reële groei van het bbp met indexcijfers (1 decimaal).`, a, eh:'%', u:`Reëel = ${100+n} / ${100+p} × 100 = ${nl1(a+100)}. De reële groei is dus ${nl1(a)}%.`} },
  productiviteit(){ const w=pick([40,50,80,100,125]), f=pick([1.02,1.04,1.05,1.08]); const P0=pick([2,4,5])*w*1000; const P1=Math.round(P0*f); const a=r1((P1/w-P0/w)/(P0/w)*100); return {t:'reken', e:'H.groei', q:`Een fabriek met ${w} werknemers maakte vorig jaar ${gt(P0)} producten en dit jaar ${gt(P1)}, met evenveel werknemers. Met hoeveel procent is de arbeidsproductiviteit gestegen?`, a, eh:'%', u:`Productiviteit = productie / werknemers: ${gt(P0/w)} → ${nl1(P1/w)}. Stijging = ${nl1(a)}%.`} },
  bbpPerInwoner(){ const bbp=pick([800,900,1000,1100]), inw=pick([16,17,17.5,18,20]); const a=Math.round(bbp*1e9/(inw*1e6)); return {t:'reken', e:'H.bbp', q:`Het bbp van een land is € ${bbp} miljard en het land heeft ${nl1(inw).replace(/,0$/,'')} miljoen inwoners. Bereken het bbp per inwoner in hele euro's.`, a, eh:'€', u:`${bbp} miljard / ${nl1(inw).replace(/,0$/,'')} miljoen = ${eur(a)} per inwoner. Let op de nullen: miljard = 10⁹, miljoen = 10⁶.`} },
  // --- I Goede tijden, slechte tijden ---
  werkloosheid(){ const bb=pick([9.5,9.8,10,10.2]), wl=pick([350,380,420,450,500,600]); const a=r1(wl/(bb*1000)*100); return {t:'reken', e:'I.werk', q:`De beroepsbevolking is ${nl1(bb)} miljoen personen en er zijn ${wl}.000 werklozen. Bereken het werkloosheidspercentage.`, a, eh:'%', u:`Werklozen / beroepsbevolking × 100% = ${wl}.000 / ${nl1(bb)} miljoen × 100% = ${nl1(a)}%.`} },

function alleVragen(){ const out=[]; for(const w in LEVELS){ for(const l of LEVELS[w]) for(const v of l.vragen) out.push(Object.assign({w,l:l.id,lniv:l.niv},v)); } if(typeof EXAMEN!=='undefined') for(const v of EXAMEN.vragen) out.push(Object.assign({w:'ex'},v)); return out }
const vrNiv = v => (!v.niv||v.niv===niv()) && (!v.lniv||v.lniv===niv());
let _vmap=null; function vraagById(id){ if(!_vmap){_vmap={}; for(const v of alleVragen()) _vmap[v.id]=v} return _vmap[id] }

function nakijken(v, antw){
  if(v.t==='mc'||v.t==='ex') return antw===v.a;
  if(v.t==='wo') return antw===v.a;
  if(v.t==='open') return antw===true;
  if(v.t==='koppel') return v.p.every((p,i)=>antw[i]===p[1]);
  if(v.t==='reken'){ const x=parseGetal(antw); if(isNaN(x)) return false; const tol = v.eh==='€'?0.011:0.051; return Math.abs(x-v.a)<=tol }
  return false;
}
// kaarten die een vraag oplevert: het begrip b, en bij koppelvragen elk begrip uit de paren dat een kaart is
let _alleKaarten=null;
function kaartenVan(v){ if(!_alleKaarten){ _alleKaarten=new Set(); for(const w in LEVELS) Object.keys(LEVELS[w].begrippen||{}).forEach(k=>_alleKaarten.add(k)) }
  const c=[v.b].concat(v.t==='koppel'?v.p.flat():[]); return [...new Set(c.filter(k=>k&&_alleKaarten.has(k)))] }
function registreer(v, goed){
  if(!v.gen){ const r=S.vr[v.id]||{g:0,f:0}; goed?r.g++:r.f++; r.t=Date.now(); S.vr[v.id]=r; }
  else { const k=v.id; const r=S.vr[k]||{g:0,f:0}; goed?r.g++:r.f++; S.vr[k]=r; }
  if(v.e){ const et=S.et[v.e]||{n:0,r:[]}; et.r=et.r.concat(goed?1:0).slice(-20); et.n++; S.et[v.e]=et; }
  let nieuweKaart=false;
  if(goed){ S.xp+=10; S.mVerd+=1; const nw=kaartenVan(v).filter(k=>!S.kaarten.includes(k)); if(nw.length){ S.kaarten.push(...nw); nieuweKaart=nw } }
  // herhaalronde: foute vragen komen terug, na 2× goed verdwijnen ze
  if(!v.gen){
    if(!goed){ if(!S.herhaal.includes(v.id)) S.herhaal.push(v.id); S.hgoed[v.id]=0; }
    else if(S.herhaal.includes(v.id)){ S.hgoed[v.id]=(S.hgoed[v.id]||0)+1; if(S.hgoed[v.id]>=2){ S.herhaal=S.herhaal.filter(x=>x!==v.id); delete S.hgoed[v.id]; } }
  }
  return nieuweKaart;
}
function etScore(code){ const et=S.et[code]; if(!et||et.r.length<3) return null; let s=0,w=0; et.r.forEach((x,i)=>{const g=i+1; s+=x*g; w+=g}); return Math.round(s/w*100) }
function domeinScore(d){ const sc=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d).map(etScore).filter(x=>x!==null); return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null }
function medaille(score){ let m=null; for(const x of MEDAIL) if(score>=x.min) m=x; return m }

function wereldStand(w){
  const lvs=lvsVoor(w).filter(speelbaar); if(!lvs.length) return null;
  const echte=lvs.filter(l=>l.vragen.length);
  return {klaar:echte.filter(l=>(S.lv[l.id]||{}).best>=MEDAIL[0].min).length, totaal:echte.length, pct:Math.round(lvs.reduce((s,l)=>s+Math.min((S.lv[l.id]||{}).best||0,VRAGEN_PER_LEVEL),0)/(lvs.length*VRAGEN_PER_LEVEL)*100), diploma:!!(S.toets[w]&&S.toets[w].klaar)};
}

function levelOpen(w,i){ const lvs=lvsVoor(w).filter(speelbaar); const l=lvs[i]; if(!l||l.id.endsWith('.r')) return true;
  const vorige=lvs.slice(0,i).filter(x=>!x.id.endsWith('.r')&&x.vragen.length&&(x.hfd||'')===(l.hfd||'')).pop();
  return !vorige||((S.lv[vorige.id]||{}).best||0)>=MEDAIL[0].min }
function toetsOpen(w){ const lvs=lvsVoor(w).filter(l=>l.vragen.length); return lvs.length>0&&lvs.every(l=>((S.lv[l.id]||{}).best||0)>=MEDAIL[0].min) }

const BADGES=[
 {id:'start',i:'🌱',n:'Eerste stap',o:'Je eerste level gespeeld'},
 {id:'brons5',i:'🥉',n:'Op stoom',o:'5 levels brons of beter'},
 {id:'goud3',i:'🥇',n:'Goudzoeker',o:'3 levels met goud'},
 {id:'diploma',i:'🎓',n:'Geslaagd',o:'Een eindtoets helemaal goed afgerond'},
 {id:'kaart20',i:'🃏',n:'Verzamelaar',o:'20 begrippenkaarten'},
 {id:'uur',i:'⏱️',n:'Doorzetter',o:'60 minuten geoefend'},
 {id:'reken',i:'🧮',n:'Rekenwonder',o:'Goud in een rekenlab'},
 {id:'herhaal',i:'🔁',n:'Foutloos',o:'Herhaalronde leeg gemaakt'}
];
function checkBadges(){
  const nieuw=[]; const geef=id=>{ if(!S.badges.includes(id)){ S.badges.push(id); nieuw.push(BADGES.find(b=>b.id===id)) } };
  const lv=Object.entries(S.lv);
  if(lv.length) geef('start');
  if(lv.filter(([k,r])=>r.best>=6).length>=5) geef('brons5');
  if(lv.filter(([k,r])=>r.best>=8).length>=3) geef('goud3');
  if(Object.values(S.toets).some(t=>t.klaar)) geef('diploma');
  if(S.kaarten.length>=20) geef('kaart20');
  if(S.tijd>=3600) geef('uur');
  if(lv.some(([k,r])=>k.endsWith('.r')&&r.best>=8)) geef('reken');
  return nieuw;
}
const THEMAS=[{id:'standaard',i:'🟠',n:'Vellesan',p:0},{id:'zee',i:'🌊',n:'Zee',p:40},{id:'bos',i:'🌲',n:'Bos',p:40},{id:'snoep',i:'🍬',n:'Snoep',p:60},{id:'nacht',i:'🌙',n:'Nacht',p:100}];
function koopThema(id){ const t=THEMAS.find(x=>x.id===id); if(munten()<t.p){ melding(`Je hebt ${t.p} munten nodig`); return } S.mUit+=t.p; S.gekocht.push(id); S.thema=id; bewaar(); zetThema(); go('collectie') }
function kiesThema(id){ S.thema=id; bewaar(); zetThema(); go('collectie') }

// ===== Oefenen: rondes starten =====
function vragenVoorLevel(l){
  const vaste=shuffle(l.vragen); const gens=(l.gens||[]);
  let set;
  if(!vaste.length&&!gens.length) return [];
  if(!vaste.length) set=Array.from({length:VRAGEN_PER_LEVEL},()=>maakGen(pick(gens)));
  else { const nGen=Math.min(gens.length?2:0,VRAGEN_PER_LEVEL); set=vaste.slice(0,VRAGEN_PER_LEVEL-nGen).concat(Array.from({length:nGen},()=>maakGen(pick(gens)))); }
  return shuffle(set);
}
function startLevel(w,lid){ const l=lvsVoor(w).find(x=>x.id===lid); if(!l||!speelbaar(l)){ melding('Dit level heeft nog geen vragen'); return } const W=WERELDEN.find(x=>x.id===w);
  Q={modus:'level',titel:l.naam,w,lid,kleur:W.kleur,vragen:vragenVoorLevel(l),i:0,res:[],terug:`go('wereld','${w}')`}; go('quiz') }
function startToets(w){ const W=WERELDEN.find(x=>x.id===w); const lvs=lvsVoor(w).filter(l=>l.vragen.length);
  const per=Math.max(3,Math.ceil((TOETS_VRAGEN-2)/Math.max(1,lvs.length))); let pool=[]; lvs.forEach(l=>pool.push(...shuffle(l.vragen.filter(v=>v.t!=='open')).slice(0,per).map(v=>Object.assign({l:l.id},v)))); pool=shuffle(pool).slice(0,TOETS_VRAGEN-2);
  const gens=[...new Set(lvsVoor(w).flatMap(l=>l.gens||[]))]; if(gens.length) pool.push(maakGen(pick(gens)),maakGen(pick(gens)));
  Q={modus:'toets',titel:`Domeintoets ${W.nr}`,w,kleur:W.kleur,vragen:shuffle(pool),i:0,res:[],ronde:1,terug:`go('wereld','${w}')`}; go('quiz') }
function startHerhaal(){ const v=shuffle(S.herhaal).slice(0,10).map(vraagById).filter(Boolean); if(!v.length){go('herhaal');return}
  Q={modus:'herhaal',titel:'Herhaalronde',vragen:v,i:0,res:[],terug:"go('herhaal')"}; go('quiz') }
function startEindterm(k){ let v=shuffle(alleVragen().filter(x=>x.e===k&&vrNiv(x))).slice(0,8); const g=Object.keys(GENS).filter(n=>maakGen(n).e===k);
  while(v.length<6&&g.length) v.push(maakGen(pick(g))); if(!v.length){melding('Hier zijn nog geen vragen voor');return}
  Q={modus:'et',titel:EINDTERMEN[k].t,vragen:shuffle(v),i:0,res:[],terug:"go('vaardig')"}; go('quiz') }
function startDomein(d){ const ets=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d);
  // zwakste eindtermen vaker: sorteer op score
  let v=alleVragen().filter(x=>ets.includes(x.e)&&vrNiv(x)); v=shuffle(v).sort((a,b)=>(etScore(a.e)??50)-(etScore(b.e)??50)).slice(0,10);
  if(d==='A'||v.length<6){ const g=Object.keys(GENS).filter(n=>ets.includes(maakGen(n).e)); while(v.length<10&&g.length) v.push(maakGen(pick(g))) }
  if(!v.length){melding('Hier zijn nog geen vragen voor');return}
  const D=DOMEINEN.find(x=>x.id===d); Q={modus:'domein',titel:D.naam,kleur:D.kleur,vragen:shuffle(v),i:0,res:[],terug:"go('vaardig')"}; go('quiz') }

  const bol=Q.vragen.map((x,i)=>`<i class="${i<Q.res.length?(Q.modus==='toets'?'nu':(Q.res[i]?'g':'f')):(i===Q.i?'nu':'')}"></i>`).join('');
  let body='';
  if(v.t==='mc') body=`<div class="opties">${v._mix.map((oi,k)=>`<button class="optie" data-k="${oi}" onclick="kies(this,${oi})"><span class="l">${'ABCD'[k]}</span><span>${esc(v.o[oi])}</span></button>`).join('')}</div>`;
  else if(v.t==='ex') body=`${v.bron?`<div class="kaart" style="margin-bottom:12px;font-size:15px;white-space:pre-wrap">${esc(v.bron)}</div>`:''}<div class="opties">${v.o.map((o,k)=>`<button class="optie" data-k="${k}" onclick="kies(this,${k})"><span class="l">${'ABCDE'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  else if(v.t==='wo') body=`<div class="opties" style="grid-template-columns:1fr 1fr"><button class="optie" data-k="true" onclick="kies(this,true)"><span class="l">✔</span><span>Waar</span></button><button class="optie" data-k="false" onclick="kies(this,false)"><span class="l">✘</span><span>Niet waar</span></button></div>`;
  else if(v.t==='koppel'){ if(!v._r) v._r=shuffle([...new Set(v.p.map(p=>p[1]))]); antw=v.p.map(()=>'');

function printExamen(){

  let v = c ? exVragen().filter(x=>x.ex===c).sort((a,b)=>a.nr-b.nr) : d ? exVragen().filter(x=>x.d===d).sort((a,b)=>a.ex<b.ex?-1:a.ex>b.ex?1:a.nr-b.nr) : null;
  if(!v){ melding('Kies een examen of een domein'); return }
  const titel = c ? 'Examen economie '+exNaam(c) : 'Examenvragen '+DOMEINEN.find(x=>x.id===d).naam;
  const imgs=[...new Set(v.flatMap(x=>x.img||[]))];
  const w=window.open('','_blank'); if(!w){ melding('Sta pop-ups toe om te printen'); return }
  const L='ABCDE';
  w.document.write(`<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>${esc(titel)}</title><style>
   body{font:14px/1.45 Arial,sans-serif;color:#000;margin:24px} h1{font-size:20px} .v{break-inside:avoid;margin:0 0 18px} .v b{display:block}
   .ctx{color:#333;font-size:13px;margin:4px 0;white-space:pre-line} .o{margin-left:18px} img{width:100%;max-width:720px;display:block;margin:8px 0;break-inside:avoid}
   .pb{break-before:page} table{border-collapse:collapse} td,th{border:1px solid #999;padding:4px 10px}
   .knop{position:fixed;top:10px;right:10px;padding:10px 16px;font-size:16px} @media print{.knop{display:none}}</style></head><body>
   <button class="knop" onclick="print()">Printen</button><h1>${esc(titel)}</h1><p>Naam: ______________________ Klas: ______ </p>
   ${v.map((x,i)=>`<div class="v"><b>${i+1}. (${x.jaar} tv${x.tv}, vraag ${x.nr}${x.titel?' · '+esc(x.titel):''})</b>${x.ctx?`<div class="ctx">${esc(x.ctx)}</div>`:''}<div style="white-space:pre-line">${esc(x.q)}</div>${x.t==='open'?'<div style="height:90px;border-bottom:1px dotted #999"></div>':(x.o||[]).map((o,k)=>`<div class="o">${L[k]}&nbsp; ${esc(o)}</div>`).join('')}</div>`).join('')}
   <div class="pb"><h1>Examenpagina's en informatiebronnen</h1>${imgs.map(s=>`<p style="font-size:12px;margin:12px 0 0">${s.replace('-o-',' · examen p. ').replace('-b-',' · bijlage p. ')}</p><img src="${location.href.replace(/[^/]*$/,'')}${EX_IMG}${s}.jpg">`).join('')}</div>
   <div class="pb"><h1>Antwoordblad</h1><table><tr><th>Vraag</th><th>Antwoord</th></tr>${v.map((x,i)=>`<tr><td>${i+1}</td><td style="width:${antw&&x.t==='open'?'auto':'120px'};white-space:pre-line">${antw?(x.t==='open'?esc(x.model||''):L[x.a]):''}</td></tr>`).join('')}</table></div>
   </body></html>`);
  w.document.close();
}

// ===== Docentendashboard =====
// Haalt alle leerlingen op via de server (actie 'overzicht') en toont ze in tabbladen.
// Werkt ook met een oudere server: velden die ontbreken worden overgeslagen.
let dTab='overzicht', dSel=null, dWereld='alle';
const DOC_KEY='ecohv-docent';

SCHERMEN.docent = function(){
  let opgeslagen=''; try{ opgeslagen=sessionStorage.getItem(DOC_KEY)||'' }catch(e){}
  if(serverModus()&&opgeslagen&&!D) setTimeout(()=>laadDocent(opgeslagen),0);
  return `<div class="wrap" style="max-width:1200px">${kop('Docentendashboard','go(\'home\')')}
   ${D?'':`<div class="kaart" style="max-width:420px">
   ${serverModus()?`<label class="label" style="margin-top:0">Docentcode</label><input type="password" id="dCode" inputmode="numeric" onkeydown="if(event.key==='Enter')laadDocent()">
   <div class="voet"><button class="knop" onclick="laadDocent()">Open dashboard</button></div>`:`<p style="margin-top:0">Het klassenoverzicht werkt zodra de server is gekoppeld. Nu zie je alleen dit apparaat.</p><button class="knop" onclick="toonDocent({spelers:[samenvatLokaal()]})">Toon dit apparaat</button>`}</div>`}
   <div id="dOut"></div></div>`;
};

async function laadDocent(code){
  const c=code||($('#dCode')?$('#dCode').value.trim():'');
  if(!c){ melding('Vul je docentcode in'); return }
  const o=$('#dOut'); if(o) o.innerHTML='<p class="zacht">Gegevens ophalen…</p>';
  try{ const j=await api('overzicht',{docentcode:c}); try{sessionStorage.setItem(DOC_KEY,c)}catch(e){} toonDocent(j) }
  catch(e){ try{sessionStorage.removeItem(DOC_KEY)}catch(x){} if(o) o.innerHTML=''; melding(e.message,4000) }
}
function toonDocent(j){ D=j; D.opgehaald=Date.now(); go('docent'); tekenDocent() }
function dVernieuw(){ let c=''; try{c=sessionStorage.getItem(DOC_KEY)||''}catch(e){} if(c) laadDocent(c); else { D=null; go('docent') } }
function dUitloggen(){ try{sessionStorage.removeItem(DOC_KEY)}catch(e){} D=null; dSel=null; go('docent') }

// ---- berekeningen ----
const etPct = et => { if(!et||!et.r||et.r.length<3) return null; let a=0,w=0; et.r.forEach((x,i)=>{a+=x*(i+1);w+=i+1}); return Math.round(a/w*100) };
// levels met vragen; met een leerling erbij alleen de levels van zijn niveau (havo/vwo)
const dLvs = (w,s) => lvsVoor(w, s?niveauVan(s.klas):'').filter(speelbaar);
const dWerelden = () => WERELDEN.filter(w=>dLvs(w.id).length);
const alleLevels = s => dWerelden().flatMap(w=>dLvs(w.id,s).map(l=>({w:w.id,l})));
const bronsN = s => alleLevels(s).filter(x=>((s.lv||{})[x.l.id]||{}).best>=MEDAIL[0].min).length;
const diplomaN = s => Object.values(s.toets||{}).filter(t=>t.klaar).length;
const exBeheerst = (s,lijst) => (lijst||exVragen(niveauVan(s.klas))).filter(v=>{const r=(s.vr||{})[v.id]; return r&&r.g>0&&r.g>=r.f}).length;
const dagenSinds = t => t? Math.floor((Date.now()-t)/864e5) : null;
function laatsteWeken(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(Date.now()-i*7*864e5); out.push({id:weekId(d), l:'wk '+weekId(d).split('-W')[1].replace(/^0/,'')}) } return out }
function laatsteDagen(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(Date.now()-i*864e5); const id=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); out.push({id, l:String(d.getDate()), t:d.toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}) } return out }
const kleurScore = v => v==null?'var(--lijn)':v>=75?'var(--goed)':v>=50?'var(--goud)':'var(--fout)';
const dc = v => v==null?'<span class="zacht">–</span>':`<b style="color:${kleurScore(v)}">${v}</b>`;
const datumKort = t => t? new Date(t).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}) : '–';

// eenvoudige staafgrafiek (één reeks, minuten); tooltip via title
function staven(items, eenheid){
  const max=Math.max(1,...items.map(x=>x.v));
  return `<div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px;border-bottom:1px solid var(--lijn)">
   ${items.map(x=>`<div title="${esc(x.t||x.l)}: ${x.v} ${eenheid}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0">
     <span style="font-size:11px;color:var(--zacht);margin-bottom:2px">${x.v||''}</span>
     <div style="width:100%;max-width:38px;height:${Math.round(x.v/max*100)}%;min-height:${x.v?2:0}px;background:var(--acc);border-radius:4px 4px 0 0"></div></div>`).join('')}</div>
   <div style="display:flex;gap:6px">${items.map(x=>`<span style="flex:1;text-align:center;font-size:11px;color:var(--zacht);min-width:0;overflow:hidden;white-space:nowrap">${esc(x.l)}</span>`).join('')}</div>`;
}
function balk(v, label, extra){ return `<div class="domein"><span>${label}</span><div class="balk" title="${v==null?'nog geen score':v+'%'}"><i style="width:${v||0}%;background:${kleurScore(v)}"></i></div><span class="pct">${v==null?'–':v}</span></div>${extra||''}` }
const tegel = (getal, label, sub) => `<div class="kaart" style="padding:14px"><div style="font-size:28px;font-weight:800;line-height:1.1">${getal}</div><div style="font-weight:700;font-size:14px">${label}</div>${sub?`<div class="zacht" style="font-size:13px">${sub}</div>`:''}</div>`;

// ---- hoofdscherm ----
function tekenDocent(){
  const o=$('#dOut'); if(!o||!D) return;
  const klassen=[...new Set(D.spelers.map(s=>s.klas))].sort();
  const sp=D.spelers.filter(s=>dKlas==='alle'||s.klas===dKlas);
  const tabs=[['overzicht','Overzicht'],['leerlingen','Leerlingen'],['vragen','Vragen'],['eindtermen','Eindtermen'],['examen','Examentrainer']];
  const kopbalk=`<div class="voet" style="justify-content:flex-start;margin:0 0 12px;align-items:center">
    <select style="max-width:170px" onchange="dKlas=this.value;dSel=null;tekenDocent()"><option value="alle">Alle groepen</option>${klassen.map(k=>`<option ${k===dKlas?'selected':''}>${esc(k)}</option>`).join('')}</select>
    ${tabs.map(([k,t])=>`<button class="knop ${dTab===k&&!dSel?'':'zacht'}" style="min-height:44px;padding:8px 14px" onclick="dTab='${k}';dSel=null;tekenDocent()">${t}</button>`).join('')}
    <span style="flex:1"></span>
    <span class="zacht" style="font-size:13px">Opgehaald ${new Date(D.opgehaald||Date.now()).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</span>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dVernieuw()">↻ Vernieuwen</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dCsv()">CSV</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="window.print()">Afdrukken</button>
    <button class="knop zacht" style="min-height:44px;padding:8px 14px" onclick="dUitloggen()">Uitloggen</button></div>`;
  let inhoud;
  if(dSel){ const s=D.spelers.find(x=>x.id===dSel); inhoud=s?dLeerling(s):'' }
  else inhoud = {overzicht:dOverzicht,leerlingen:dLeerlingen,vragen:dVragen,eindtermen:dEindtermen,examen:dExamen}[dTab](sp);
  o.innerHTML=kopbalk+(sp.length||dSel?inhoud:'<div class="kaart"><p class="zacht" style="margin:0">Nog geen leerlingen in deze groep.</p></div>');
}

function dOverzicht(sp){
  const n=sp.length, actief=sp.filter(s=>(s.tijdWeek||0)>0).length;
  const gemWeek=n?Math.round(sp.reduce((a,s)=>a+(s.tijdWeek||0),0)/n/60):0;
  const gemBrons=n?Math.round(sp.reduce((a,s)=>a+bronsN(s)/Math.max(1,alleLevels(s).length),0)/n*100):0;
  const dipl=sp.reduce((a,s)=>a+diplomaN(s),0);
  const heeftVr=sp.some(s=>s.vr); const exN=exVragen('').length;
  const gemEx=heeftVr&&n?Math.round(sp.reduce((a,s)=>a+exBeheerst(s),0)/n):null;
  const weken=laatsteWeken(8).map(w=>({l:w.l,t:'Week '+w.id.split('-W')[1],v:Math.round(sp.reduce((a,s)=>a+((s.week||{})[w.id]||0),0)/60)}));
  const dagen=laatsteDagen(14).map(d=>({l:d.l,v:Math.round(sp.reduce((a,s)=>a+((s.dag||{})[d.id]||0),0)/60)}));
  const heeftDag=sp.some(s=>s.dag&&Object.keys(s.dag).length);
  // aandacht
  const stil=sp.filter(s=>{const d=dagenSinds(s.laatst); return d==null||d>=7}).sort((a,b)=>(a.laatst||0)-(b.laatst||0));
  const zwak=[]; sp.forEach(s=>DOMEINEN.forEach(d=>{const v=(s.dom||{})[d.id]; if(v!=null&&v<50) zwak.push({s,d,v})})); zwak.sort((a,b)=>a.v-b.v);
  const veelHerhaal=sp.filter(s=>(s.herhaal||0)>=10).sort((a,b)=>b.herhaal-a.herhaal);
  const domGem=DOMEINEN.map(d=>{const l=sp.map(s=>(s.dom||{})[d.id]).filter(v=>v!=null); return {d,v:l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):null,n:l.length}});
  const wereldStandKlas=dWerelden().map(w=>{const lv=dLvs(w.id); const pct=n?Math.round(sp.reduce((a,s)=>a+lv.filter(l=>((s.lv||{})[l.id]||{}).best>=MEDAIL[0].min).length,0)/(n*lv.length)*100):0; const dip=sp.filter(s=>((s.toets||{})[w.id]||{}).klaar).length; return {w,pct,dip}});
  const lnk=s=>`<a href="#" onclick="dSel='${esc(s.id)}';tekenDocent();return false" style="color:var(--acc);font-weight:700">${esc(s.naam)}</a>`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px">
     ${tegel(n,'leerlingen',`${actief} actief deze week`)}
     ${tegel(gemWeek+' min','gem. oefentijd deze week','per leerling')}
     ${tegel(gemBrons+'%','levels brons of beter','gemiddeld over alle domeinen')}
     ${tegel(dipl,'diploma\'s behaald','eindtoetsen helemaal goed')}
     ${gemEx!=null&&exN?tegel(gemEx,'examenvragen beheerst','gemiddeld per leerling'):''}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
    <div class="kaart"><b>Oefentijd van de groep per week</b> <span class="zacht" style="font-size:13px">(minuten, alle leerlingen samen)</span>${staven(weken,'min')}</div>
    ${heeftDag?`<div class="kaart"><b>Oefentijd per dag</b> <span class="zacht" style="font-size:13px">(laatste 14 dagen, minuten)</span>${staven(dagen,'min')}</div>`:''}
    <div class="kaart"><b>Gemiddelde score per domein</b>${domGem.map(x=>balk(x.v,x.d.icoon,'')).join('')}<p class="zacht" style="font-size:12px;margin:6px 0 0">${domGem.map(x=>`${x.d.icoon} ${x.d.naam} (${x.n} lln)`).join(' · ')}</p></div>
    <div class="kaart"><b>Voortgang per domein</b> <span class="zacht" style="font-size:13px">(% levels brons · diploma's)</span>${wereldStandKlas.map(x=>`<div class="domein" style="grid-template-columns:34px 1fr 90px"><span>${x.w.icoon}</span><div class="balk" title="H${x.w.nr} ${esc(x.w.naam)}: ${x.pct}%"><i style="width:${x.pct}%;background:${x.w.kleur}"></i></div><span class="pct" style="font-weight:600;font-size:14px">${x.pct}% · 🎓${x.dip}</span></div>`).join('')}</div>
   </div>
   <div class="sectie">Aandacht nodig</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
    <div class="kaart"><b>Al een week niet geoefend</b>${stil.length?stil.slice(0,12).map(s=>`<div class="rij">${lnk(s)}<span style="flex:1"></span><span class="zacht" style="font-size:13px">${s.laatst?dagenSinds(s.laatst)+' dagen':'nooit'}</span></div>`).join(''):'<p class="zacht">Iedereen is deze week actief geweest.</p>'}</div>
    <div class="kaart"><b>Lage domeinscores (onder 50)</b>${zwak.length?zwak.slice(0,12).map(x=>`<div class="rij">${lnk(x.s)}<span style="flex:1;font-size:14px">${x.d.icoon} ${x.d.naam}</span>${dc(x.v)}</div>`).join(''):'<p class="zacht">Geen scores onder de 50.</p>'}</div>
    <div class="kaart"><b>Veel foute vragen open (10 of meer)</b>${veelHerhaal.length?veelHerhaal.slice(0,12).map(s=>`<div class="rij">${lnk(s)}<span style="flex:1"></span><span class="zacht" style="font-size:13px">${s.herhaal} in herhaalronde</span></div>`).join(''):'<p class="zacht">Niemand heeft een lange herhaallijst.</p>'}</div>
   </div>`;
}

function dLeerlingen(sp){
  const exN=exVragen('').length;
  const rijen=sp.map(s=>({s,totLv:alleLevels(s).length,brons:bronsN(s),dipl:diplomaN(s),ex:s.vr?exBeheerst(s):null}));
  const k={week:(a,b)=>(b.s.tijdWeek||0)-(a.s.tijdWeek||0),tijd:(a,b)=>(b.s.tijd||0)-(a.s.tijd||0),naam:(a,b)=>a.s.naam.localeCompare(b.s.naam,'nl'),voortgang:(a,b)=>b.brons-a.brons,examen:(a,b)=>(b.ex||0)-(a.ex||0),laatst:(a,b)=>(b.s.laatst||0)-(a.s.laatst||0)};
  rijen.sort(k[dSort]||k.week);
  const th=(key,t)=>`<th style="cursor:pointer;${dSort===key?'color:var(--acc)':''}" onclick="dSort='${key}';tekenDocent()">${t}${dSort===key?' ▾':''}</th>`;
  return `<p class="zacht" style="margin:0 0 8px;font-size:14px">Klik op een kolomkop om te sorteren en op een naam voor alle details.</p>
   <div class="kaart tabelwrap"><table><thead><tr><th>#</th>${th('naam','Leerling')}<th>Groep</th>${th('week','Deze week')}${th('tijd','Totaal')}${th('voortgang','Levels')}<th>Diploma\'s</th>${exN?th('examen','Examen'):''}${DOMEINEN.map(d=>`<th title="${d.naam}">${d.icoon}</th>`).join('')}${th('laatst','Laatst')}<th>ID · code</th></tr></thead><tbody>
   ${rijen.map((r,i)=>{const s=r.s; return `<tr style="cursor:pointer" onclick="dSel='${esc(s.id)}';tekenDocent()"><td>${dSort==='naam'?'':i+1}</td><td><b style="color:var(--acc)">${esc(s.naam)}</b></td><td>${esc(s.klas)}</td><td>${minuten(s.tijdWeek)} min</td><td>${minuten(s.tijd)} min</td>
     <td style="min-width:110px"><div class="balk" title="${r.brons} van ${r.totLv}"><i style="width:${Math.round(r.brons/Math.max(1,r.totLv)*100)}%"></i></div><span style="font-size:12px" class="zacht">${r.brons}/${r.totLv}</span></td>
     <td>${r.dipl?'🎓 '+r.dipl:'–'}</td>${exN?`<td>${r.ex==null?'–':r.ex+'/'+exVragen(niveauVan(s.klas)).length}</td>`:''}${DOMEINEN.map(d=>`<td>${dc((s.dom||{})[d.id])}</td>`).join('')}
     <td style="font-size:13px">${datumKort(s.laatst)}</td><td style="font-size:12px">${esc(s.id||'')}<br>${esc(s.code||'')}</td></tr>`}).join('')}
   </tbody></table></div>`;
}

function dLeerling(s){
  const weken=laatsteWeken(8).map(w=>({l:w.l,t:'Week '+w.id.split('-W')[1],v:Math.round(((s.week||{})[w.id]||0)/60)}));
  const dagen=laatsteDagen(14).map(d=>({l:d.l,v:Math.round(((s.dag||{})[d.id]||0)/60)}));
  const exN=exVragen(niveauVan(s.klas)).length;
  const werelden=dWerelden().map(w=>{ const t=(s.toets||{})[w.id];
    const lv=dLvs(w.id,s).map(l=>{const r=(s.lv||{})[l.id]; const m=r&&r.best!=null?medaille(r.best):null; return `<span title="${esc(l.naam)}: ${r&&r.best!=null?'beste '+r.best+'/'+VRAGEN_PER_LEVEL:'nog niet gespeeld'}" style="display:inline-block;min-width:34px;text-align:center;padding:4px 6px;border-radius:8px;border:1px solid var(--lijn);font-size:13px;margin:2px">${m?m.e:(r&&r.best!=null?r.best:'·')}</span>`}).join('');
    return `<div class="rij" style="flex-wrap:wrap"><span style="width:34px;font-size:22px">${w.icoon}</span><span style="flex:1;min-width:160px"><b>${w.nr} ${esc(w.naam)}</b><br><span class="zacht" style="font-size:13px">Domeintoets: ${t?(t.eerste!=null?'eerste poging '+t.eerste+'/'+(t.tot||TOETS_VRAGEN):'gestart')+(t.klaar?' · 🎓 diploma':' · nog niet alles goed'):'nog niet gemaakt'}</span></span><span>${lv}</span></div>` }).join('');
  const etRijen=DOMEINEN.map(d=>{ const codes=Object.keys(EINDTERMEN).filter(k=>EINDTERMEN[k].d===d.id); const r=codes.map(k=>({k,v:etPct((s.et||{})[k]),n:((s.et||{})[k]||{}).n||0})).filter(x=>x.n);
    return `<div style="margin-bottom:10px"><b>${d.icoon} ${d.naam}</b> ${dc((s.dom||{})[d.id])}${r.length?r.map(x=>`<div class="domein" style="grid-template-columns:1fr 120px 46px;font-size:14px"><span>${esc(EINDTERMEN[x.k].t)} <span class="zacht">(${x.n}×)</span></span><div class="balk"><i style="width:${x.v||0}%;background:${kleurScore(x.v)}"></i></div><span class="pct">${x.v==null?'–':x.v}</span></div>`).join(''):'<div class="zacht" style="font-size:13px">Nog niet geoefend.</div>'}</div>` }).join('');
  const fout=Object.entries(s.vr||{}).filter(([k,r])=>!k.startsWith('gen.')&&r.f>0).map(([k,r])=>({k,r,v:vraagById(k)})).filter(x=>x.v).sort((a,b)=>(b.r.f-b.r.g)-(a.r.f-a.r.g)||b.r.f-a.r.f).slice(0,10);
  const foutOud=!s.vr&&s.fout?Object.entries(s.fout).filter(([k])=>!k.startsWith('gen.')).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,f])=>({k,r:{f,g:0},v:vraagById(k)})).filter(x=>x.v):[];
  const exRijen=exN&&s.vr?exLijst(niveauVan(s.klas)).map(({c,v})=>{const b=exBeheerst(s,v); const gemaakt=v.filter(x=>(s.vr||{})[x.id]).length; return `<div class="domein" style="grid-template-columns:150px 1fr 70px;font-size:14px"><span>${exNaam(c)}</span><div class="balk" title="${gemaakt} gemaakt, ${b} beheerst"><i style="width:${Math.round(b/v.length*100)}%"></i></div><span class="pct">${b}/${v.length}</span></div>`}).join(''):'';
  return `<button class="terug" onclick="dSel=null;tekenDocent()">‹ Terug naar ${dTab==='overzicht'?'het overzicht':'de lijst'}</button>
   <div class="kaart" style="margin:8px 0 14px"><div style="display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline"><h2 style="margin:0">${esc(s.naam)}</h2><span>${esc(s.klas)}</span><span class="zacht">ID ${esc(s.id||'')} · herstelcode ${esc(s.code||'–')}</span><span class="zacht">Account sinds ${datumKort(s.aangemaakt)} · laatst actief ${datumKort(s.laatst)}</span></div></div>
   <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px">
    ${tegel(minuten(s.tijdWeek)+' min','deze week')}${tegel(minuten(s.tijd)+' min','totaal geoefend')}
    ${tegel(bronsN(s)+'/'+alleLevels(s).length,'levels brons+')}${tegel(diplomaN(s)+'/'+dWerelden().length,'diploma\'s')}
    ${exN&&s.vr?tegel(exBeheerst(s)+'/'+exN,'examenvragen beheerst'):''}${s.sprint?tegel((s.sprint.best||0)+'/15','sprintrecord',(s.sprint.n||0)+' sprints'):''}
    ${s.herhaal!=null?tegel(s.herhaal,'in herhaalronde','foute vragen nog open'):''}${s.nk!=null?tegel(s.nk,'begrippenkaarten',(s.badges||[]).length+' badges · '+(s.munten||0)+' munten'):''}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
    <div class="kaart"><b>Oefentijd per week</b> <span class="zacht" style="font-size:13px">(minuten)</span>${staven(weken,'min')}</div>
    ${s.dag?`<div class="kaart"><b>Oefentijd per dag</b> <span class="zacht" style="font-size:13px">(laatste 14 dagen)</span>${staven(dagen,'min')}</div>`:''}
   </div>
   <div class="sectie">Domeinen en levels</div><div class="kaart"><p class="zacht" style="margin:0 0 6px;font-size:13px">Per level de beste medaille (🥉 6, 🥈 7, 🥇 8 van 8). Een getal is een beste score zonder medaille, een punt is nog niet gespeeld.</p>${werelden}</div>
   <div class="sectie">Vaardigheden per eindterm</div><div class="kaart">${etRijen}</div>
   <div class="sectie">Vragen die het vaakst fout gingen</div><div class="kaart">${(fout.length?fout:foutOud).length?(fout.length?fout:foutOud).map(x=>`<div class="rij" style="display:block"><b>${x.r.f}× fout${x.r.g?', '+x.r.g+'× goed':''}</b> · <span class="zacht" style="font-size:13px">${esc(x.v.w==='ex'?'Examen '+x.v.jaar+' tv'+x.v.tv+' vraag '+x.v.nr:(WERELDEN.find(w=>w.id===x.v.w)||{}).naam||'')}</span><br>${esc(x.v.q)}<br><span class="zacht">Juist: ${esc(juistTekst(x.v))}</span></div>`).join(''):'<p class="zacht">Nog geen foute vragen.</p>'}</div>
   ${exRijen?`<div class="sectie">Examentrainer per examen</div><div class="kaart">${exRijen}</div>`:''}`;
}

function dVragen(sp){
  const tel={}; sp.forEach(s=>{ const bron=s.vr||Object.fromEntries(Object.entries(s.fout||{}).map(([k,f])=>[k,{f,g:0}]));
    Object.entries(bron).forEach(([k,r])=>{ if(k.startsWith('gen.')) return; const t=tel[k]||(tel[k]={g:0,f:0,ll:0,llF:0}); t.g+=r.g||0; t.f+=r.f||0; t.ll++; if(r.f>(r.g||0)) t.llF++ }) });
  const wereldOpt=[['alle','Alle domeinen']].concat(dWerelden().map(w=>[w.id,w.nr+' '+w.naam]),exVragen('').length?[['ex','Examenvragen']]:[]);
  let lijst=Object.entries(tel).map(([k,t])=>({k,t,v:vraagById(k)})).filter(x=>x.v&&(dWereld==='alle'||x.v.w===dWereld)&&(x.t.g+x.t.f)>=2);
  lijst.forEach(x=>x.p=Math.round(x.t.f/(x.t.g+x.t.f)*100)); lijst.sort((a,b)=>b.p-a.p||b.t.f-a.t.f);
  const rekengen={}; sp.forEach(s=>Object.entries(s.vr||{}).forEach(([k,r])=>{ if(!k.startsWith('gen.')) return; const t=rekengen[k]||(rekengen[k]={g:0,f:0}); t.g+=r.g||0; t.f+=r.f||0 }));
  const gl=Object.entries(rekengen).filter(([k,t])=>t.g+t.f>=3).map(([k,t])=>({k,t,p:Math.round(t.f/(t.g+t.f)*100),voorb:(()=>{try{return maakGen(k.slice(4)).q}catch(e){return k}})()})).sort((a,b)=>b.p-a.p).slice(0,12);
  return `<div class="voet" style="justify-content:flex-start;margin:0 0 10px"><select style="max-width:300px" onchange="dWereld=this.value;tekenDocent()">${wereldOpt.map(([k,t])=>`<option value="${k}" ${k===dWereld?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
   <div class="kaart"><b>Moeilijkste vragen</b> <span class="zacht" style="font-size:13px">(percentage fout van alle pogingen, minstens 2 pogingen)</span>
   ${lijst.length?lijst.slice(0,25).map(x=>`<div class="rij" style="display:block"><div style="display:flex;gap:10px;align-items:center"><b style="min-width:52px;color:${kleurScore(100-x.p)}">${x.p}% fout</b><div class="balk" style="flex:1;max-width:220px"><i style="width:${x.p}%;background:var(--fout)"></i></div><span class="zacht" style="font-size:13px">${x.t.f} fout · ${x.t.g} goed · ${x.t.ll} lln${x.t.llF?' · '+x.t.llF+' vaker fout dan goed':''}</span></div>
     <div style="margin-top:4px">${esc(x.v.q)}</div><div class="zacht" style="font-size:14px">Juist: ${esc(juistTekst(x.v))} · ${esc(x.v.w==='ex'?'Examen '+x.v.jaar+' tv'+x.v.tv+' vraag '+x.v.nr:(WERELDEN.find(w=>w.id===x.v.w)||{}).naam||'')} · ${esc((EINDTERMEN[x.v.e]||{}).t||'')}</div></div>`).join(''):'<p class="zacht">Nog te weinig gegevens.</p>'}</div>
   ${gl.length&&dWereld==='alle'?`<div class="sectie">Rekensommen met wisselende getallen</div><div class="kaart">${gl.map(x=>`<div class="rij"><b style="min-width:52px;color:${kleurScore(100-x.p)}">${x.p}% fout</b><span style="flex:1;font-size:14px">${esc(x.voorb)}</span><span class="zacht" style="font-size:13px">${x.t.f+x.t.g} pogingen</span></div>`).join('')}</div>`:''}`;
}

function dEindtermen(sp){
  const codes=Object.keys(EINDTERMEN).filter(k=>!k.startsWith('EX.'));
  const gem=k=>{const l=sp.map(s=>etPct((s.et||{})[k])).filter(v=>v!=null); return l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length):null};
  const cel=v=>`<td title="${v==null?'nog geen score':v+'%'}" style="text-align:center;padding:6px 4px;background:${v==null?'transparent':`color-mix(in srgb,${kleurScore(v)} 22%,var(--kaart))`};font-size:13px">${v==null?'<span class="zacht">·</span>':v}</td>`;
  const kop=DOMEINEN.map(d=>{const c=codes.filter(k=>EINDTERMEN[k].d===d.id); return `<th colspan="${c.length}" style="text-align:center;border-left:2px solid var(--lijn)">${d.icoon} ${d.naam}</th>`}).join('');
  const kop2=DOMEINEN.flatMap(d=>codes.filter(k=>EINDTERMEN[k].d===d.id).map((k,i)=>`<th title="${esc(EINDTERMEN[k].t)}" style="text-align:center;font-size:11px;${i===0?'border-left:2px solid var(--lijn)':''}">${k}</th>`)).join('');
  const volg=DOMEINEN.flatMap(d=>codes.filter(k=>EINDTERMEN[k].d===d.id));
  const lijst=sp.slice().sort((a,b)=>a.naam.localeCompare(b.naam,'nl'));
  return `<p class="zacht" style="margin:0 0 8px;font-size:14px">Score per eindterm (0 tot 100) op basis van de laatste 20 antwoorden, vanaf 3 antwoorden. Groen 75+, geel 50-74, rood onder 50. Houd de muis op een code voor de omschrijving.</p>
   <div class="kaart tabelwrap"><table style="font-size:13px"><thead><tr><th></th>${kop}</tr><tr><th>Leerling</th>${kop2}</tr></thead><tbody>
    <tr style="font-weight:800"><td>Groepsgemiddelde</td>${volg.map(k=>cel(gem(k))).join('')}</tr>
    ${lijst.map(s=>`<tr><td style="white-space:nowrap"><a href="#" onclick="dSel='${esc(s.id)}';tekenDocent();return false" style="color:var(--acc)">${esc(s.naam)}</a></td>${volg.map(k=>cel(etPct((s.et||{})[k]))).join('')}</tr>`).join('')}
   </tbody></table></div>
   <div class="sectie">Eindtermen van zwak naar sterk</div><div class="kaart">${volg.map(k=>({k,v:gem(k)})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v).map(x=>balk(x.v,`<span style="font-size:13px">${esc(EINDTERMEN[x.k].t)} <span class="zacht">(${x.k})</span></span>`)).join('').replace(/class="domein"/g,'class="domein" style="grid-template-columns:minmax(160px,1.4fr) 1fr 52px"')||'<p class="zacht">Nog geen gegevens.</p>'}</div>`;
}

function dExamen(sp){
  if(!exVragen('').length) return '<div class="kaart"><p style="margin:0">Er staan nog geen examenvragen in de app.</p></div>';
  if(!sp.some(s=>s.vr)) return '<div class="kaart"><p style="margin:0">Voor dit overzicht heeft de server de nieuwste versie van Code.gs nodig. Zie de stappen in de handleiding.</p></div>';
  const ex=exLijst('');
  const rij=s=>`<tr><td style="white-space:nowrap"><a href="#" onclick="dSel='${esc(s.id)}';tekenDocent();return false" style="color:var(--acc)">${esc(s.naam)}</a></td><td>${exBeheerst(s)}</td><td>${s.sprint?s.sprint.best+'/15':'–'}</td>${ex.map(({v})=>{const b=exBeheerst(s,v), g=v.filter(x=>(s.vr||{})[x.id]).length; const p=g?Math.round(b/v.length*100):null; return `<td title="${g} van ${v.length} gemaakt, ${b} beheerst" style="text-align:center;background:${p==null?'transparent':`color-mix(in srgb,${kleurScore(p)} 22%,var(--kaart))`}">${g?b+'/'+v.length:'<span class="zacht">·</span>'}</td>`}).join('')}</tr>`;
  const domein=DOMEINEN.filter(d=>exVragen('').some(x=>x.d===d.id)).map(d=>{const l=sp.map(s=>{const v=exVragen(niveauVan(s.klas)).filter(x=>x.d===d.id); return v.length?exBeheerst(s,v)/v.length*100:0}); return {d,v:Math.round(l.reduce((a,b)=>a+b,0)/Math.max(1,l.length))}});
  return `<div class="kaart" style="margin-bottom:14px"><b>Gemiddeld beheerst per domein</b>${domein.map(x=>balk(x.v,x.d.icoon)).join('')}</div>
   <div class="kaart tabelwrap"><table style="font-size:13px"><thead><tr><th>Leerling</th><th>Beheerst</th><th>Sprint</th>${ex.map(({c})=>`<th style="text-align:center;font-size:11px">${2000+ +c.slice(0,2)}<br>tv${c[3]}</th>`).join('')}</tr></thead>
   <tbody>${sp.slice().sort((a,b)=>exBeheerst(b)-exBeheerst(a)).map(rij).join('')}</tbody></table></div>`;
}

function dCsv(){
  if(!D) return; const sp=D.spelers.filter(s=>dKlas==='alle'||s.klas===dKlas);
  const kop=['Naam','Groep','ID','Herstelcode','Minuten deze week','Minuten totaal','Levels brons','Diplomas','Examen beheerst'].concat(DOMEINEN.map(d=>d.naam),['Laatst actief']);
  const r=sp.map(s=>[s.naam,s.klas,s.id,s.code,minuten(s.tijdWeek),minuten(s.tijd),bronsN(s),diplomaN(s),s.vr?exBeheerst(s):''].concat(DOMEINEN.map(d=>(s.dom||{})[d.id]??''),[s.laatst?new Date(s.laatst).toLocaleDateString('nl-NL'):'']));
  const csv='﻿'+[kop].concat(r).map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`economiehv_${dKlas}_${vandaag()}.csv`; a.click();
}

start();
</script>
</body>
</html>
